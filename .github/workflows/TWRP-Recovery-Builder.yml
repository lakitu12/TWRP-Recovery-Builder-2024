name: TWRP Recovery Builder 2024

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-16.0'
        type: choice
        options:
          - twrp-16.0
          - twrp-14.1
          - twrp-12.1
          - twrp-11
          - twrp-9.0
      DEVICE_TREE:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/lakitu12/device_xiaomi_dash_twrp'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'twrp-16.0'
      DEVICE_PATH:
        description: 'Device Path (e.g. device/xiaomi/dash)'
        required: true
        default: 'device/xiaomi/dash'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'dash'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot
      LDCHECK:
        description: 'Path of blobs to check'
        required: true
        default: 'system/bin/recovery'
      RECOVERY_TAR:
        description: 'Release Recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer.zip'
        type: boolean
        required: true
        default: false

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write
    steps:
      - name: Check Out
        uses: actions/checkout@v3

      - name: Display Inputs
        run: |
          echo "::group::Build Configuration"
          echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "Device Tree:     ${{ github.event.inputs.DEVICE_TREE }}"
          echo "Device Branch:   ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
          echo "Device Path:     ${{ github.event.inputs.DEVICE_PATH }}"
          echo "Device Name:     ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Build Target:    ${{ github.event.inputs.BUILD_TARGET }}"
          echo "::endgroup::"

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Prepare the environment
        run: |
          sudo apt update
          sudo apt -y upgrade
          sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            lib32ncurses5-dev x11proto-core-dev lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libwxgtk3.0-gtk3-dev lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libtinfo5 \
            libgflags-dev
          sudo add-apt-repository universe
          sudo apt -y install libncurses5

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Install Git-Repo
        run: |
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Check Manifest Branch
        uses: haya14busa/action-cond@v1
        id: manifest
        with:
          cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' || github.event.inputs.MANIFEST_BRANCH == 'twrp-14.1' || github.event.inputs.MANIFEST_BRANCH == 'twrp-16.0' }}
          if_true: https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git
          if_false: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

      - name: Initialize Repo
        run: |
          mkdir workspace
          cd workspace
          git config --global user.name "TWRP Builder"
          git config --global user.email "builder@twrp.local"
          repo init --depth=1 -u ${{ steps.manifest.outputs.value }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}

      - name: Apply Device local_manifest
        run: |
          # Extract owner/repo from DEVICE_TREE URL to construct raw URL
          DT_URL="${{ github.event.inputs.DEVICE_TREE }}"
          DT_URL="${DT_URL%.git}"
          DT_URL="${DT_URL#https://github.com/}"
          RAW_URL="https://raw.githubusercontent.com/${DT_URL}/${{ github.event.inputs.DEVICE_TREE_BRANCH }}/local_manifest.xml"
          echo "Trying local_manifest from: $RAW_URL"
          mkdir -p workspace/.repo/local_manifests
          if curl -sLf -o workspace/.repo/local_manifests/device.xml "$RAW_URL" 2>/dev/null; then
            echo "✓ Applied local_manifest.xml from device tree"
            echo "--- content ---"
            cat workspace/.repo/local_manifests/device.xml
            echo "--- end ---"
          else
            echo "No local_manifest.xml found (device tree will be cloned after sync)"
          fi

      - name: Repo Sync
        run: |
          cd workspace
          repo sync -j4 --force-sync

      - name: Fix magiskboot ELF check for 16K page size
        run: |
          cd workspace
          MK="external/magisk-prebuilt/prebuilt/Android.mk"
          if [ -f "$MK" ]; then
            grep -q 'LOCAL_CHECK_ELF_FILES' "$MK" || \
              sed -i '/^[[:space:]]*LOCAL_MODULE := magiskboot$/a\    LOCAL_CHECK_ELF_FILES := false' "$MK"
            echo "✓ Patched magiskboot: check_elf_files disabled"
          else
            echo "⚠ magisk-prebuilt not found under external/"
            find . -path "*/magisk-prebuilt*" -name "Android.mk" 2>/dev/null || true
          fi

      - name: Clone Device Tree (if not via local_manifest)
        run: |
          cd workspace
          if [ -d "${{ github.event.inputs.DEVICE_PATH }}" ]; then
            echo "Device tree already synced via local_manifest"
          else
            echo "Cloning device tree..."
            git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
          fi
          cd ${{ github.event.inputs.DEVICE_PATH }}
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Check Build Makefile
        run: |
          cd workspace
          if [ -f ${{ github.event.inputs.DEVICE_PATH }}/twrp_${{ github.event.inputs.DEVICE_NAME }}.mk ]; then
            echo "DEVICE_MAKEFILE=twrp_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
          elif [ -f ${{ github.event.inputs.DEVICE_PATH }}/omni_${{ github.event.inputs.DEVICE_NAME }}.mk ]; then
            echo "DEVICE_MAKEFILE=omni_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
          else
            echo "ERROR: No recovery makefile found!"
            ls ${{ github.event.inputs.DEVICE_PATH }}/*.mk || true
            exit 1
          fi
        continue-on-error: true

      - name: Determine Build Variant
        run: |
          case "${{ github.event.inputs.MANIFEST_BRANCH }}" in
            twrp-16.0) echo "BUILD_VARIANT=bp2a" >> $GITHUB_ENV ;;
            twrp-14.1) echo "BUILD_VARIANT=ap4a" >> $GITHUB_ENV ;;
            twrp-12.1) echo "BUILD_VARIANT=sp2a" >> $GITHUB_ENV ;;
            twrp-11)   echo "BUILD_VARIANT=rp1a" >> $GITHUB_ENV ;;
            twrp-9.0)  echo "BUILD_VARIANT=pi" >> $GITHUB_ENV ;;
            *)         echo "BUILD_VARIANT=eng" >> $GITHUB_ENV ;;
          esac
          echo "Build variant: ${{ env.BUILD_VARIANT }}"

      - name: Install Python 2
        continue-on-error: true
        if: github.event.inputs.MANIFEST_BRANCH != 'twrp-11' && github.event.inputs.MANIFEST_BRANCH != 'twrp-12.1' && github.event.inputs.MANIFEST_BRANCH != 'twrp-14'
        run: |
          sudo apt -y install python2
          cd /usr/bin
          sudo ln -sf python2 python

      - name: Building Image
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch ${{ env.DEVICE_MAKEFILE }}-${{ env.BUILD_VARIANT }}-eng

          BUILD_TARGET="${{ github.event.inputs.BUILD_TARGET }}"
          case "$BUILD_TARGET" in
            vendorboot)
              echo "Building vendorbootimage..."
              set +e
              make vendorbootimage -j$(nproc --all)
              MAKE_EXIT=$?
              set -e
              echo "=== make exit code: $MAKE_EXIT ==="
              ;;
            boot|recovery)
              echo "Building ${BUILD_TARGET}image..."
              set +e
              make ${BUILD_TARGET}image -j$(nproc --all)
              MAKE_EXIT=$?
              set -e
              echo "=== make exit code: $MAKE_EXIT ==="
              ;;
          esac
          echo "Done building."
          echo "=== Output .img files ==="
          find "out/target/product/${{ github.event.inputs.DEVICE_NAME }}/" -maxdepth 1 -name "*.img" -ls 2>/dev/null || echo "No .img files found"
          echo "=== recovery/root/ ==="
          ls -la "out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/" 2>/dev/null | head -20 || echo "recovery/root not found"
          if [ -n "$MAKE_EXIT" ] && [ "$MAKE_EXIT" -ne 0 ]; then
            exit $MAKE_EXIT
          fi

      - name: Set Build Date
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
          DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
          if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
            DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
          fi
          echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

      - name: Prepare Release Assets
        run: |
          cd workspace
          echo "=== Current directory: $(pwd) ==="
          echo "=== Globs in PRODUCT_OUT ==="
          ls -la "out/target/product/${{ github.event.inputs.DEVICE_NAME }}/" 2>/dev/null || echo "PRODUCT_OUT dir not found"
          PRODUCT_OUT="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
          BUILD_TARGET="${{ github.event.inputs.BUILD_TARGET }}"

          case "$BUILD_TARGET" in
            vendorboot)
              ASSET="$PRODUCT_OUT/vendor_boot.img"
              ASSET_NAME="vendor_boot.img"
              ;;
            recovery)
              ASSET="$PRODUCT_OUT/recovery.img"
              ASSET_NAME="recovery.img"
              ;;
            boot)
              ASSET="$PRODUCT_OUT/boot.img"
              ASSET_NAME="boot.img"
              ;;
            *)
              echo "ERROR: Unknown BUILD_TARGET=$BUILD_TARGET"
              ASSET=""
              ASSET_NAME=""
              ;;
          esac

          if [ -n "$ASSET" ] && [ -f "$ASSET" ]; then
            echo "RELEASE_ASSET=$ASSET" >> $GITHUB_ENV
            echo "RELEASE_ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum "$ASSET" | cut -d ' ' -f 1)" >> $GITHUB_ENV
            echo "✓ Asset: $ASSET ($(du -h "$ASSET" | cut -f1))"
          else
            echo "WARNING: Expected asset not found: $ASSET"
            # Fallback: find any .img
            FALLBACK=$(find "$PRODUCT_OUT" -maxdepth 1 -name "*.img" -type f 2>/dev/null | head -1)
            if [ -n "$FALLBACK" ]; then
              echo "RELEASE_ASSET=$FALLBACK" >> $GITHUB_ENV
              echo "RELEASE_ASSET_NAME=$(basename "$FALLBACK")" >> $GITHUB_ENV
              echo "MD5_IMG=$(md5sum "$FALLBACK" | cut -d ' ' -f 1)" >> $GITHUB_ENV
              echo "⚠ Using fallback: $FALLBACK"
            else
              echo "RELEASE_ASSET_NAME=" >> $GITHUB_ENV
              echo "MD5_IMG=N/A" >> $GITHUB_ENV
              echo "=== Full PRODUCT_OUT tree ==="
              find "$PRODUCT_OUT" -type f -name "*.img" -o -name "*.gz" -o -name "*.cpio" 2>/dev/null | head -20 || echo "(empty)"
            fi
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ env.RELEASE_ASSET_NAME }}
          name: Unofficial TWRP for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Build Target: ${{ github.event.inputs.BUILD_TARGET }}
            Device: [${{ github.event.inputs.DEVICE_NAME }}](${{ env.DEVICE_TREE_URL }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
            Commit: [${{ env.COMMIT_ID }}](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }})
            MD5: ${{ env.MD5_IMG }}

      - name: Checking For Missing Dependencies
        continue-on-error: true
        run: |
          PRODUCT_OUT="$GITHUB_WORKSPACE/workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
          if [ -d "$PRODUCT_OUT/recovery/root" ]; then
            cd tools
            mv -n libneeds "$PRODUCT_OUT/recovery/root/" 2>/dev/null || true
            mv -n ldcheck "$PRODUCT_OUT/recovery/root/" 2>/dev/null || true
            cd "$PRODUCT_OUT/recovery/root"
            python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ github.event.inputs.LDCHECK }}
          fi
          echo "Done checking missing dependencies."